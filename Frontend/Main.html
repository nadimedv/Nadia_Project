<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ЛР1 – Варіант 11 (Чергування). Мєдвєдєва</title>

    <link rel="icon" type="image/png" href="Kitty1.png">
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <header>
        <h1>Сервіс чергувань у лабораторії (варіант 11) </h1>
        <p>Додайте чергування — воно з’явиться у таблиці. Можна редагувати, шукати, фільтрувати, сортувати.</p>
    </header>

    <main>
        <section id="create-section">
            <h2>Додати / редагувати чергування</h2>

            <form id="createForm">
                <div class="field">
                    <label for="userInput">Користувач</label>
                    <input
                            id="userInput"
                            type="text"
                            placeholder="Напр., Іван Петренко"
                            required
                            minlength="3"
                            maxlength="30"
                    />
                    <p class="error-text" id="userError"></p>
                </div>

                <div class="field">
                    <label for="typeSelect">Тип чергування</label>
                    <select id="typeSelect" required>
                        <option value="">Оберіть тип</option>
                        <option value="Ранкове">Ранкове</option>
                        <option value="Денне">Денне</option>
                        <option value="Вечірнє">Вечірнє</option>
                    </select>
                    <p class="error-text" id="typeError"></p>
                </div>

                <div class="field">
                    <label for="dateInput">Дата</label>
                    <input id="dateInput" type="date" required />
                    <p class="error-text" id="dateError"></p>
                </div>

                <div class="field">
                    <label for="timeFromInput">Час початку</label>
                    <input id="timeFromInput" type="time" required />
                    <p class="error-text" id="timeFromError"></p>
                </div>

                <div class="field">
                    <label for="timeToInput">Час завершення</label>
                    <input id="timeToInput" type="time" required />
                    <p class="error-text" id="timeToError"></p>
                </div>

                <div class="buttons">
                    <button type="submit" id="submitBtn">Додати</button>
                    <button type="button" id="resetBtn">Очистити</button>
                    <button type="button" id="cancelEditBtn" class="hidden">Скасувати редагування</button>
                </div>
            </form>
        </section>

        <section id="list-section">
            <h2>Список чергувань</h2>

            <div class="toolbar">
                <div class="tool">
                    <label for="searchInput">Пошук (за ім’ям)</label>
                    <input id="searchInput" type="text" placeholder="Напр., Петренко" />
                </div>

                <div class="tool">
                    <label for="typeFilterSelect">Фільтр (тип)</label>
                    <select id="typeFilterSelect">
                        <option value="">Усі</option>
                        <option value="Ранкове">Ранкове</option>
                        <option value="Денне">Денне</option>
                        <option value="Вечірнє">Вечірнє</option>
                    </select>
                </div>

                <div class="tool">
                    <label for="sortSelect">Сортування</label>
                    <select id="sortSelect">
                        <option value="dateAsc">Дата/час ↑</option>
                        <option value="dateDesc">Дата/час ↓</option>
                        <option value="userAsc">Користувач A→Я</option>
                    </select>
                </div>
            </div>

            <table id="itemsTable">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Користувач</th>
                    <th>Тип</th>
                    <th>Дата</th>
                    <th>Час</th>
                    <th>Дії</th>
                </tr>
                </thead>
                <tbody id="itemsTableBody">
                </tbody>
            </table>

            <p id="emptyState" class="muted hidden">Немає записів за заданими умовами.</p>
        </section>
    </main>
</div>
</body>
</html>
