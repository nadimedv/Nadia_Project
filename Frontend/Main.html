<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій застосунок - Nadia Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Мій застосунок (варіант N)</h1> </header>

<main>
    <section id="create-section">
        <h2>Додати запис</h2> <form id="createForm"> <div class="field">
        <label for="field1Input">Поле 1</label>
        <input id="field1Input" type="text">
        <p class="error-text" id="field1Error"></p>
    </div>

        <div class="field">
            <label for="field2Select">Поле 2</label>
            <select id="field2Select">
                <option value="">Оберіть значення</option>
                <option value="A">A</option>
                <option value="B">B</option>
            </select>
            <p class="error-text" id="field2Error"></p>
        </div>

        <div class="field">
            <label for="field3Text">Коментар</label>
            <textarea id="field3Text" rows="4"></textarea>
            <p class="error-text" id="field3Error"></p>
        </div>

        <div class="buttons">
            <button type="submit">Додати</button> <button type="button" id="resetBtn">Очистити</button> </div>

    </form>
    </section>

    <hr>

    <section id="list-section">
        <h2>Список записів</h2> <table id="itemsTable">
        <thead>
        <tr>
            <th>Поле 1</th>
            <th>Поле 2</th>
            <th>Коментар</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody id="itemTableBody">
        </tbody>
    </table>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
