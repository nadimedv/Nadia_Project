<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ЛР1 – Варіант 11 (Чергування). Мєдвєдєва</title>
    <link rel="icon" type="image/png" href="Kitty1.png">
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <header>
        <h1>Сервіс чергувань у лабораторії</h1>
        <p>Заповніть форму і натисніть <strong>Додати</strong>. Запис з’явиться у таблиці нижче.</p>
    </header>

    <main>
        <section id="create-section">
            <h2>Додати чергування</h2>

            <form id="createForm">
                <div class="field">
                    <label for="userInput">Користувач</label>
                    <input
                            id="userInput"
                            type="text"
                            placeholder="Напр., Іван Петренко"
                            required
                            minlength="3"
                            maxlength="30"
                    />
                    <p class="error-text" id="userError"></p>
                </div>

                <div class="field">
                    <label for="dateInput">Дата</label>
                    <input id="dateInput" type="date" required />
                    <p class="error-text" id="dateError"></p>
                </div>

                <div class="field">
                    <label for="timeFromInput">Час початку</label>
                    <input id="timeFromInput" type="time" required />
                    <p class="error-text" id="timeFromError"></p>
                </div>

                <div class="field">
                    <label for="timeToInput">Час завершення</label>
                    <input id="timeToInput" type="time" required />
                    <p class="error-text" id="timeToError"></p>
                </div>

                <div class="buttons">
                    <button type="submit">Додати</button>
                    <button type="button" id="resetBtn">Очистити</button>
                </div>
            </form>
        </section>

        <section id="list-section">
            <h2>Список чергувань</h2>

            <table id="itemsTable">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Користувач</th>
                    <th>Дата</th>
                    <th>Час</th>
                    <th>Дії</th>
                </tr>
                </thead>
                <tbody id="itemsTableBody">
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
